name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            asset: cloakgpt-linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: cloakgpt-linux-arm64
          - os: macos-15-intel
            target: macos-x86_64
            asset: cloakgpt-macos-x86_64
          - os: macos-15
            target: macos-arm64
            asset: cloakgpt-macos-arm64
          - os: windows-2025
            target: windows-x86_64
            asset: cloakgpt-windows-x86_64.exe
          - os: windows-11-arm
            target: windows-arm64
            asset: cloakgpt-windows-arm64.exe

    steps:
      - uses: actions/checkout@v6
      - name: Write build metadata
        shell: python
        env:
          CLOAKGPT_ASSET_NAME: ${{ matrix.asset }}
        run: |
          import os
          from pathlib import Path

          is_tag = os.environ.get("GITHUB_REF_TYPE") == "tag"
          version = (
              os.environ["GITHUB_REF_NAME"]
              if is_tag
              else f"dev-{os.environ['GITHUB_SHA'][:12]}"
          )
          channel = "prerelease" if is_tag and "-" in version else "stable"
          Path("cloakgpt_build.py").write_text(
              "\n".join(
                  [
                      '"""Generated release build metadata."""',
                      "",
                      f"VERSION = {version!r}",
                      f"CHANNEL = {channel!r}",
                      f"ASSET_NAME = {os.environ['CLOAKGPT_ASSET_NAME']!r}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install OpenSSL for Windows ARM64
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:arm64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Import Developer ID certificate
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "error: macOS signing secrets are not configured" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/cloakgpt-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identities="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application:/ {print $2}'
          )"
          identity_count="$(printf '%s\n' "$identities" | grep -c . || true)"
          if [[ "$identity_count" -ne 1 ]]; then
            echo "error: expected exactly one Developer ID Application identity; found $identity_count" >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=$(printf '%s\n' "$identities" | head -n 1)" >> "$GITHUB_ENV"
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm cloakgpt.spec
      - name: Name release asset
        shell: python
        run: |
          from pathlib import Path

          source = next(Path("dist").glob("cloakgpt*"))
          source.rename(Path("dist") / "${{ matrix.asset }}")
      - name: Smoke test executable
        run: ./dist/${{ matrix.asset }} --help
      - name: Verify embedded build metadata
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          expected = (
              os.environ["GITHUB_REF_NAME"]
              if os.environ.get("GITHUB_REF_TYPE") == "tag"
              else f"dev-{os.environ['GITHUB_SHA'][:12]}"
          )
          output = subprocess.check_output(
              [str(Path("dist/${{ matrix.asset }}").resolve()), "--version"],
              text=True,
              encoding="utf-8",
          )
          if expected not in output or "${{ matrix.asset }}" not in output:
              raise SystemExit(f"unexpected build metadata: {output!r}")
      - name: Smoke test updater TLS
        run: ./dist/${{ matrix.asset }} update --check --channel prerelease
      - name: Smoke test bundled Playwright driver
        run: ./dist/${{ matrix.asset }} _playwright_check
      - name: Verify Developer ID signature
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "dist/${{ matrix.asset }}"
          codesign --display --verbose=4 "dist/${{ matrix.asset }}"
          entitlements="$RUNNER_TEMP/cloakgpt-entitlements.plist"
          codesign --display --entitlements :- "dist/${{ matrix.asset }}" \
            > "$entitlements" 2>/dev/null
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-jit' \
            "$entitlements" | grep -qx true
          /usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.cs.allow-unsigned-executable-memory' \
            "$entitlements" | grep -qx true
      - name: Notarize macOS executable
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_API_KEY_P8_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" ]]; then
            echo "error: Apple notarization secrets are not configured" >&2
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          archive_path="$RUNNER_TEMP/${{ matrix.asset }}.zip"
          api_key_id="$(printf '%s' "$APPLE_API_KEY_ID" | tr -d '[:space:]')"
          api_issuer_id="$(printf '%s' "$APPLE_API_ISSUER_ID" | tr -d '[:space:]')"
          if [[ ! "$api_key_id" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "error: Apple API key ID must contain only letters and numbers" >&2
            exit 1
          fi
          if [[ ! "$api_issuer_id" =~ ^[A-Fa-f0-9-]+$ ]]; then
            echo "error: Apple API issuer ID must be a UUID" >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"
          ditto -c -k --keepParent "dist/${{ matrix.asset }}" "$archive_path"

          xcrun notarytool submit "$archive_path" \
            --key "$api_key_path" \
            --key-id "$api_key_id" \
            --issuer "$api_issuer_id" \
            --wait
      - name: Write SHA-256 checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          asset = Path("dist/${{ matrix.asset }}")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          asset.with_name(asset.name + ".sha256").write_text(
              f"{digest}  {asset.name}\n",
              encoding="ascii",
          )
      - uses: actions/upload-artifact@v7
        with:
          name: cloakgpt-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Remove signing materials
        if: always() && startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/cloakgpt-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/cloakgpt-entitlements.plist" \
            "$RUNNER_TEMP/${{ matrix.asset }}.zip"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cloakgpt-*
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${release_flags[@]}"
