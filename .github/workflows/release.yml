name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
            asset: cloakgpt-linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: cloakgpt-linux-arm64
          - os: macos-15-intel
            target: macos-x86_64
            asset: cloakgpt-macos-x86_64
          - os: macos-15
            target: macos-arm64
            asset: cloakgpt-macos-arm64
          - os: windows-2025
            target: windows-x86_64
            asset: cloakgpt-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm cloakgpt.spec
      - name: Name release asset
        shell: python
        run: |
          from pathlib import Path

          source = next(Path("dist").glob("cloakgpt*"))
          source.rename(Path("dist") / "${{ matrix.asset }}")
      - name: Smoke test executable
        run: ./dist/${{ matrix.asset }} --help
      - name: Write SHA-256 checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          asset = Path("dist/${{ matrix.asset }}")
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          asset.with_name(asset.name + ".sha256").write_text(
              f"{digest}  {asset.name}\n",
              encoding="ascii",
          )
      - uses: actions/upload-artifact@v7
        with:
          name: cloakgpt-${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cloakgpt-*
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
