name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check POSIX scripts
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh scripts/uninstall.sh
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = "scripts/install.ps1", "scripts/uninstall.ps1"
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Write-Error
              exit 1
            }
          }
